name: Drive Migrate CI

on:
  push:
    branches: [main]
    paths:
      - 'migrate-google-drive-files/**'
      - '.github/workflows/migrate-google-drive-files-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'migrate-google-drive-files/**'
      - '.github/workflows/migrate-google-drive-files-ci.yml'

defaults:
  run:
    working-directory: ./migrate-google-drive-files

jobs:
  check:
    name: Test, lint, and type-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: migrate-google-drive-files/uv.lock

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check drive_migrate tests

      - name: Tests (pytest)
        run: uv run pytest
