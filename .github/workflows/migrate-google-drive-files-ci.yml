name: Drive Migrate CI

on:
  push:
    branches: [main]
    paths:
      - 'migrate-google-drive-files/**'
      - '.github/workflows/migrate-google-drive-files-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'migrate-google-drive-files/**'
      - '.github/workflows/migrate-google-drive-files-ci.yml'

defaults:
  run:
    working-directory: ./migrate-google-drive-files

jobs:
  check:
    name: Test, lint, and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: migrate-google-drive-files/uv.lock
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check drive_migrate tests

      - name: Tests (pytest)
        run: uv run pytest
