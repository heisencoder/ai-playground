name: Polyarb CI

on:
  push:
    branches: [main]
    paths:
      - 'polyarb/**'
      - '.github/workflows/polyarb-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'polyarb/**'
      - '.github/workflows/polyarb-ci.yml'

defaults:
  run:
    working-directory: ./polyarb

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: polyarb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: polyarb/coverage/lcov.info
          flags: unittests
          name: codecov-polyarb
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: polyarb/coverage/
          retention-days: 30

      - name: Build
        run: npm run build
