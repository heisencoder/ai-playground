name: QR Code CI

on:
  push:
    branches: [main]
    paths:
      - 'qrcode/**'
      - '.github/workflows/qrcode-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'qrcode/**'
      - '.github/workflows/qrcode-ci.yml'

defaults:
  run:
    working-directory: ./qrcode

jobs:
  build:
    name: Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: qrcode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrcode-dist
          path: qrcode/dist
          retention-days: 7
