name: CI

on:
  push:
    branches: [main]
    paths:
      - 'gnome-unibar/**'
      - '.github/workflows/gnome-unibar-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gnome-unibar/**'
      - '.github/workflows/gnome-unibar-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./gnome-unibar

jobs:
  quality:
    name: Lint, format, test, coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gnome-unibar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: gnome-unibar/coverage/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Build extension bundle
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build extension bundle
        run: bash scripts/pack.sh

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: unibar-extension
          path: gnome-unibar/dist/*.zip
          if-no-files-found: error
          retention-days: 30
