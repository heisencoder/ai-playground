name: Basketball CI

on:
  push:
    branches: [main]
    paths:
      - 'basketball/**'
      - '.github/workflows/basketball-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'basketball/**'
      - '.github/workflows/basketball-ci.yml'

defaults:
  run:
    working-directory: ./basketball

jobs:
  build:
    name: Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: basketball/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npm run build:server

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: basketball
          push: false
          load: true
          tags: basketball:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image runs
        working-directory: .
        run: |
          echo "Starting container..."
          docker run -d --name test-container -p 8080:8080 basketball:test

          sleep 2
          echo "=== Container status after 2 seconds ==="
          docker ps -a --filter name=test-container

          if ! docker ps --filter name=test-container | grep -q test-container; then
            echo "ERROR: Container exited immediately!"
            docker logs test-container 2>&1
            docker inspect test-container --format='Exit Code: {{.State.ExitCode}}'
            docker rm test-container
            exit 1
          fi

          for i in {3..15}; do
            echo "[$i/15] Waiting... (${i}s elapsed)"
            sleep 1

            if ! docker ps | grep -q test-container; then
              echo "ERROR: Container exited after ${i} seconds!"
              docker logs test-container 2>&1
              docker rm test-container
              exit 1
            fi

            if [ $i -ge 5 ]; then
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "Health check passed after ${i} seconds!"
                docker logs test-container 2>&1 | tail -20
                docker stop test-container
                docker rm test-container
                exit 0
              fi
            fi
          done

          echo "Final health check attempt..."
          if ! curl -v --fail http://localhost:8080/health 2>&1; then
            echo "ERROR: Health check failed after 15 seconds"
            docker logs test-container 2>&1
            docker stop test-container
            docker rm test-container
            exit 1
          fi

          docker stop test-container
          docker rm test-container
