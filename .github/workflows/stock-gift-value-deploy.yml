name: Stock Gift Value Deploy

on:
  release:
    types: [published]

# Only run if the release tag starts with 'stock-gift-value/'
# The workflow will exit early if the tag doesn't match
jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Only deploy for stock-gift-value releases
    if: startsWith(github.event.release.tag_name, 'stock-gift-value/')

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    env:
      # Extract version from tag (e.g., 'stock-gift-value/v1.0.0' -> 'v1.0.0')
      VERSION: ${{ github.event.release.tag_name }}
      REGION: us-central1
      SERVICE_NAME: stock-gift-value

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'stock-gift-value/' prefix from tag
          VERSION="${GITHUB_REF_NAME#stock-gift-value/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.STOCK_GIFT_VALUE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.STOCK_GIFT_VALUE_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.STOCK_GIFT_VALUE_GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        working-directory: ./stock-gift-value
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.STOCK_GIFT_VALUE_GCP_PROJECT_ID }}/${{ secrets.STOCK_GIFT_VALUE_GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.version.outputs.version }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.STOCK_GIFT_VALUE_GCP_PROJECT_ID }}/${{ secrets.STOCK_GIFT_VALUE_GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.STOCK_GIFT_VALUE_GCP_PROJECT_ID }}/${{ secrets.STOCK_GIFT_VALUE_GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.version.outputs.version }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.STOCK_GIFT_VALUE_GCP_PROJECT_ID }}/${{ secrets.STOCK_GIFT_VALUE_GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.STOCK_GIFT_VALUE_GCP_PROJECT_ID }}/${{ secrets.STOCK_GIFT_VALUE_GCP_ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ steps.version.outputs.version }}
          flags: |
            --memory=256Mi
            --cpu=1
            --max-instances=5
            --port=8080
            --allow-unauthenticated
            --startup-probe httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=2,periodSeconds=1,timeoutSeconds=1,failureThreshold=3

      - name: Show deployment URL
        run: |
          echo "✅ Deployed successfully!"
          echo "🌐 URL: ${{ steps.deploy.outputs.url }}"
          echo ""
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
