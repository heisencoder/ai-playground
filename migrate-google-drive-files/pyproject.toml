[project]
name = "drive-migrate"
version = "0.1.0"
description = "Migrate a My Drive folder tree into a Google Workspace shared drive."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
drive-migrate = "drive_migrate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drive_migrate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
