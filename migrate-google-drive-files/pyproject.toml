[project]
name = "drive-migrate"
version = "0.1.0"
description = "Migrate a My Drive folder tree into a Google Workspace shared drive."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
drive-migrate = "drive_migrate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drive_migrate"]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "B", "C4", "DTZ",
    "G", "ISC", "LOG", "PIE", "PT", "RSE", "RET", "SIM", "TID",
    "ARG", "PTH", "RUF",
]
ignore = [
    # `Any` is genuinely required for the untyped googleapiclient service/resource
    # objects (DriveClient.__init__(service), _exec(request)); annotating them as
    # anything narrower would be dishonest.
    "ANN401",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are consumed for their side effects, so fixtures such as
# `fake`, `state` and `tree` fire ARG when a test does not reference them directly.
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
