[project]
name = "drive-migrate"
version = "0.1.0"
description = "Migrate a My Drive folder tree into a Google Workspace shared drive."
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
]

[project.scripts]
drive-migrate = "drive_migrate.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drive_migrate"]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "B", "C4", "DTZ",
    "G", "ISC", "LOG", "PIE", "PT", "RSE", "RET", "SIM", "TID",
    "ARG", "PTH", "RUF",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# `Any` defeats the type checker. Use a precise type, the real class of an
# untyped third-party surface (e.g. googleapiclient's Resource/HttpRequest), or a
# type alias (e.g. state.JsonValue, drive.QueryValue/BodyValue) instead.
"typing.Any".msg = "Do not use Any; use a precise type or a type alias."

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are consumed for their side effects, so fixtures such as
# `fake`, `state` and `tree` fire ARG when a test does not reference them directly.
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
