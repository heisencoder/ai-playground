<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Transparent background -->

  <!-- Outstretched open hand (palm up, offering gesture) -->
  <g fill="#c9a07a">
    <!-- Palm base -->
    <ellipse cx="16" cy="27" rx="9" ry="4"/>
    <!-- Fingers spread upward -->
    <rect x="5" y="20" width="2.8" height="9" rx="1.4"/>
    <rect x="9" y="17" width="2.8" height="12" rx="1.4"/>
    <rect x="14.6" y="16" width="2.8" height="13" rx="1.4"/>
    <rect x="20.2" y="17" width="2.8" height="12" rx="1.4"/>
    <rect x="24.2" y="20" width="2.8" height="9" rx="1.4"/>
  </g>

  <!-- Green dollar sign with single vertical bar -->
  <g>
    <!-- Vertical bar -->
    <rect x="14.5" y="1" width="3" height="17" rx="1.5" fill="#16a34a"/>
    <!-- S curve -->
    <path d="M11 5.5 C11 3.5 13 2 16 2 C19 2 21 3.5 21 5.5 C21 7.5 19 8.5 16 9.5 C13 10.5 11 11.5 11 13.5 C11 15.5 13 17 16 17 C19 17 21 15.5 21 13.5"
          stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
