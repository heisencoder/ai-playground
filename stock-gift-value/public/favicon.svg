<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Transparent background -->

  <!-- Left hand palm-up (wrist on left, fingertips on right) -->
  <g fill="#c9a07a">
    <!-- Palm -->
    <ellipse cx="12" cy="24" rx="6" ry="5"/>
    <!-- Thumb (at top) -->
    <ellipse cx="9" cy="17" rx="2" ry="3.5"/>
    <!-- Index finger -->
    <rect x="14" y="19" width="10" height="2.5" rx="1.25"/>
    <!-- Middle finger -->
    <rect x="14" y="22" width="12" height="2.5" rx="1.25"/>
    <!-- Ring finger -->
    <rect x="14" y="25" width="10" height="2.5" rx="1.25"/>
    <!-- Pinky finger -->
    <rect x="14" y="28" width="7" height="2.5" rx="1.25"/>
    <!-- Wrist -->
    <rect x="2" y="21" width="8" height="6" rx="2"/>
  </g>

  <!-- Green dollar sign with single vertical bar, sitting in palm -->
  <g>
    <!-- Vertical bar - bottom sits in center of palm -->
    <rect x="10.5" y="2" width="3" height="20" rx="1.5" fill="#16a34a"/>
    <!-- S curve (correct orientation: top curves right, bottom curves right) -->
    <path d="M17 5 C17 3 15 1.5 12 1.5 C9 1.5 7 3 7 5 C7 7 9 8 12 9 C15 10 17 11 17 13 C17 15 15 16.5 12 16.5 C9 16.5 7 15 7 13"
          stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
