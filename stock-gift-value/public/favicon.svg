<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Transparent background -->

  <!-- Left hand side view (wrist left, one finger visible, thumb on palm) -->
  <g>
    <!-- Wrist -->
    <rect x="1" y="22" width="7" height="5" rx="2" fill="#c9a07a" stroke="#000" stroke-width="0.5"/>
    <!-- Palm -->
    <ellipse cx="12" cy="24" rx="6" ry="5" fill="#c9a07a" stroke="#000" stroke-width="0.5"/>
    <!-- Single finger (side view) -->
    <rect x="17" y="22" width="11" height="4" rx="2" fill="#c9a07a" stroke="#000" stroke-width="0.5"/>
    <!-- Thumb resting on palm -->
    <ellipse cx="12" cy="20" rx="3" ry="2" fill="#c9a07a" stroke="#000" stroke-width="0.5"/>
  </g>

  <!-- Green dollar sign centered on icon (x=16), with black outline -->
  <g>
    <!-- S curve (centered at x=16) -->
    <path d="M21 5 C21 2.5 18.5 1 16 1 C13.5 1 11 2.5 11 5 C11 7.5 13.5 8.5 16 9.5 C18.5 10.5 21 11.5 21 14 C21 16.5 18.5 18 16 18 C13.5 18 11 16.5 11 14"
          stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M21 5 C21 2.5 18.5 1 16 1 C13.5 1 11 2.5 11 5 C11 7.5 13.5 8.5 16 9.5 C18.5 10.5 21 11.5 21 14 C21 16.5 18.5 18 16 18 C13.5 18 11 16.5 11 14"
          stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Vertical bar centered at x=16, bottom in palm -->
    <rect x="14.25" y="0" width="3.5" height="22" rx="1.75" fill="#000"/>
    <rect x="14.75" y="0.5" width="2.5" height="21" rx="1.25" fill="#16a34a"/>
  </g>
</svg>
